[package]
name = "gpx-studio-desktop"
version = "0.1.0"
description = "Desktop shell for gpx.studio"
edition = "2021"

[lib]
name = "gpx_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
gpx-engine = { path = "../gpx-rs/engine" }

[workspace]
